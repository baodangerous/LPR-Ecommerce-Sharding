<svg width="680" viewBox="0 0 680 840" xmlns="http://www.w3.org/2000/svg" role="img"
     style="background:#ffffff;font-family:ui-sans-serif,system-ui,sans-serif">
  <title>LPR system architecture</title>
  <desc>Lightweight Proactive Re-sharding: workload generator → request router → shard layer → LPR controller → migration engine → key_to_shard_map → router (feedback loop).</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="30" y="20" width="612" height="800" rx="14" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-size="11" font-weight="400" fill="#5F5E5A" x="336" y="40" text-anchor="middle">Trusted distributed database environment</text>

  <!-- TIER 1: Workload generator -->
  <rect x="52" y="52" width="568" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#3C3489" x="336" y="80" text-anchor="middle" dominant-baseline="central">Workload generator</text>
  <rect x="72"  y="86" width="152" height="36" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="12" font-weight="400" fill="#3C3489" x="148" y="104" text-anchor="middle" dominant-baseline="central">Uniform</text>
  <rect x="260" y="86" width="152" height="36" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="12" font-weight="400" fill="#3C3489" x="336" y="104" text-anchor="middle" dominant-baseline="central">Zipfian  s = 2.0</text>
  <rect x="448" y="86" width="152" height="36" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="12" font-weight="400" fill="#3C3489" x="524" y="104" text-anchor="middle" dominant-baseline="central">Flash-sale  +40%</text>

  <!-- Arrow 1→2 -->
  <line x1="336" y1="136" x2="336" y2="158" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text font-size="11" fill="#888780" x="348" y="150" dominant-baseline="central">requests</text>

  <!-- TIER 2: Router -->
  <rect x="52" y="162" width="568" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#0C447C" x="336" y="182" text-anchor="middle" dominant-baseline="central">Request router</text>
  <text font-size="12" font-weight="400" fill="#185FA5" x="336" y="202" text-anchor="middle" dominant-baseline="central">Consistent hashing</text>

  <!-- Arrow 2→3 -->
  <line x1="336" y1="214" x2="336" y2="236" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text font-size="11" fill="#888780" x="348" y="228" dominant-baseline="central">route to shard</text>

  <!-- TIER 3: Shards -->
  <rect x="52" y="240" width="568" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#085041" x="336" y="260" text-anchor="middle" dominant-baseline="central">Data layer — 4 shards</text>
  <rect x="68"  y="272" width="124" height="44" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="13" font-weight="500" fill="#085041" x="130" y="290" text-anchor="middle" dominant-baseline="central">Shard S0</text>
  <text font-size="11" font-weight="400" fill="#0F6E56" x="130" y="306" text-anchor="middle" dominant-baseline="central">key partition</text>
  <rect x="204" y="272" width="124" height="44" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="13" font-weight="500" fill="#085041" x="266" y="290" text-anchor="middle" dominant-baseline="central">Shard S1</text>
  <text font-size="11" font-weight="400" fill="#0F6E56" x="266" y="306" text-anchor="middle" dominant-baseline="central">key partition</text>
  <rect x="340" y="272" width="124" height="44" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="13" font-weight="500" fill="#085041" x="402" y="290" text-anchor="middle" dominant-baseline="central">Shard S2</text>
  <text font-size="11" font-weight="400" fill="#0F6E56" x="402" y="306" text-anchor="middle" dominant-baseline="central">key partition</text>
  <rect x="476" y="272" width="124" height="44" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="13" font-weight="500" fill="#085041" x="538" y="290" text-anchor="middle" dominant-baseline="central">Shard S3</text>
  <text font-size="11" font-weight="400" fill="#0F6E56" x="538" y="306" text-anchor="middle" dominant-baseline="central">key partition</text>

  <!-- Arrow 3→4 -->
  <line x1="336" y1="332" x2="336" y2="354" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text font-size="11" fill="#888780" x="348" y="346" dominant-baseline="central">L_i(t) metrics</text>

  <!-- TIER 4: LPR Controller -->
  <rect x="52" y="358" width="568" height="236" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#633806" x="336" y="378" text-anchor="middle" dominant-baseline="central">LPR controller</text>

  <rect x="72" y="394" width="528" height="34" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text font-size="12" font-weight="400" fill="#412402" x="88" y="411" dominant-baseline="central">EMA filter</text>
  <text font-size="11" font-weight="400" fill="#633806" x="592" y="411" text-anchor="end" dominant-baseline="central">smooth load signal — noise suppression</text>

  <rect x="72" y="436" width="528" height="34" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text font-size="12" font-weight="400" fill="#412402" x="88" y="453" dominant-baseline="central">Growth rate  GR_i(t)</text>
  <text font-size="11" font-weight="400" fill="#633806" x="592" y="453" text-anchor="end" dominant-baseline="central">detect load acceleration</text>

  <rect x="72" y="478" width="528" height="34" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text font-size="12" font-weight="400" fill="#412402" x="88" y="495" dominant-baseline="central">Hotspot score  H_i(t)</text>
  <text font-size="11" font-weight="400" fill="#633806" x="592" y="495" text-anchor="end" dominant-baseline="central">unified proactive signal</text>

  <rect x="72" y="520" width="528" height="34" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text font-size="12" font-weight="400" fill="#412402" x="88" y="537" dominant-baseline="central">Adaptive threshold  T_adaptive(t)</text>
  <text font-size="11" font-weight="400" fill="#633806" x="592" y="537" text-anchor="end" dominant-baseline="central">self-adjusting decision bound</text>

  <rect x="72" y="562" width="528" height="34" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text font-size="12" font-weight="400" fill="#412402" x="88" y="579" dominant-baseline="central">Cost-benefit gate</text>
  <text font-size="11" font-weight="400" fill="#633806" x="592" y="579" text-anchor="end" dominant-baseline="central">benefit &gt; 1.2 × migration cost</text>

  <!-- Arrow 4→5 -->
  <line x1="336" y1="594" x2="336" y2="616" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text font-size="11" fill="#888780" x="348" y="608" dominant-baseline="central">migration decision</text>

  <!-- TIER 5: Migration engine -->
  <rect x="52" y="620" width="568" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#712B13" x="336" y="640" text-anchor="middle" dominant-baseline="central">Hot-key migration engine</text>
  <text font-size="12" font-weight="400" fill="#993C1D" x="336" y="658" text-anchor="middle" dominant-baseline="central">top-10% hot keys  →  coolest shard</text>

  <!-- Arrow 5→6 -->
  <line x1="336" y1="672" x2="336" y2="694" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text font-size="11" fill="#888780" x="348" y="686" dominant-baseline="central">update routing map</text>

  <!-- TIER 6: key_to_shard_map -->
  <rect x="52" y="698" width="568" height="40" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#2C2C2A" x="336" y="718" text-anchor="middle" dominant-baseline="central">key_to_shard_map</text>

  <!-- Feedback arrow (right side, fully outside content x=620) -->
  <path d="M620 718 L642 718 L642 188 L620 188" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
</svg>
